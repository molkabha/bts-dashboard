name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'
  WORKING_DIRECTORY: '.'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r ${{ env.WORKING_DIRECTORY }} -f json -o bandit-results.json
    
    - name: Check for vulnerabilities
      run: |
        safety check --json
    
    - name: Upload security results
      uses: actions/upload-artifact@v4
      with:
        name: security-results
        path: bandit-results.json

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Run Black formatter
      run: |
        black --check ${{ env.WORKING_DIRECTORY }}
    
    - name: Run isort
      run: |
        isort --check-only ${{ env.WORKING_DIRECTORY }}
    
    - name: Run flake8
      run: |
        flake8 ${{ env.WORKING_DIRECTORY }} --max-line-length=100
    
    - name: Run mypy
      run: |
        mypy ${{ env.WORKING_DIRECTORY }} --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ env.WORKING_DIRECTORY }}/requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-xdist
    
    - name: Run tests with coverage (parallelized)
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        export PYTHONPATH=$PYTHONPATH:.
        pytest tests/ -v -n auto --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./${{ env.WORKING_DIRECTORY }}/coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ${{ env.WORKING_DIRECTORY }}/htmlcov/
          ${{ env.WORKING_DIRECTORY }}/coverage.xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.WORKING_DIRECTORY }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:latest
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Deploy to Kubernetes (Staging)
      run: |
        echo "Deploying ${{ github.sha }} to staging..."
        # In a real scenario, you would use secrets for KUBECONFIG
        # kubectl set image deployment/dashboard dashboard=ghcr.io/${{ github.repository }}:${{ github.sha }} -n staging --kubeconfig=...
        
        # Simulating a successful deployment for demonstration
        kubectl version --client

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Deploy to Kubernetes (Production)
      run: |
        echo "Deploying ${{ github.sha }} to production..."
        # kubectl set image deployment/dashboard dashboard=ghcr.io/${{ github.repository }}:${{ github.sha }} -n production --kubeconfig=${{ secrets.KUBECONFIG }}
        
        # Simulating a successful deployment for demonstration
        kubectl version --client
